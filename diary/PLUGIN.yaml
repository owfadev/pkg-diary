id: diary
version: 0.3
depends:
  - vault
  - structure
  - mapping
  - log
updated: 2026-10-20
attachment:
  - "vault/diary/ — diary territory (the path is the territory; one md file per day, name = YYYY-MM-DD, free-prose body; final-state assets under the vault write model — agent writes append-only, edit/delete freedom belongs to the human)"
fields:
  date: "scalar (optional) — entry date YYYY-MM-DD; the file name is authoritative, the frontmatter copy exists only for viewer convenience and may be absent entirely"
inject: "Diary zone `vault/diary/` (personal daily writing, one md per day YYYY-MM-DD, expected 100% human writing — the agent transcribes dictation verbatim; delegation stays secretarial: format tidy-up / organizing on request): entries are ordinary vault assets — each write closes with a registration-first map into wiki/vault/ (proxy + index, one-line description, no content copy), query/grep/cite like any text; privacy applies at use: derivations quote minimally and backlink, log/hot stay mechanical, nothing leaves the instance without explicit request; boundaries — calendar when, todo pending, diary lived"
usage:
  - "Writing (写日记 / 记一下…): verbatim dictation — land at `vault/diary/YYYY-MM-DD.md` (today), absent → create with minimal frontmatter (date only, optional) + a `# YYYY-MM-DD` heading; entries append as new `## HH:MM` blocks; the user's phrasing as spoken, never invented"
  - "Secretarial delegation (整理格式 / 调整结构 / 归并条目 — expected lightweight; one explicit instruction per act): tidy formatting, reorder or merge blocks as instructed; substantive drafting (帮我写) is rare, honored only on explicit ask with the block marked 代笔 — never unasked, never batched; instance git is the undo net"
  - "Projection (install = exposure consent): every entry write closes with the normal map pipeline — registration-first proxy at `wiki/vault/<original-path>.md` (raw_file / raw_sha256, one-line description, no full copy — the mapping block's diary carve-out: summaries not enforced) + index linkage; human edits to a vault entry re-map on the next diary touch or on request"
  - "Reading / querying: ordinary corpus treatment — grep and read `vault/diary/` directly, cite via [[wikilinks]] to the proxy pages; digests only on explicit request, clearly marked"
  - "Use-time privacy: derivations out of the diary (notes conclusions, cross-references, profile evidence) quote minimally and backlink the source entry; log/hot lines stay mechanical (fact, never content); diary content never leaves the instance — external relay or framework/package repositories need an explicit request"
  - "Boundaries: calendar = what happens when, todo = what is pending, diary = what was lived; promoting diary material into notes goes only through the existing save path on explicit user request (derivations out-only)"
commands:
  - diary
checks:
  - "Semantic items (v0.1 manual, attached audit deferred): a diary entry landing outside vault/diary/ → error; an UNREQUESTED rewrite or deletion of existing blocks → error; an agent-drafted block left without the 代笔 mark → warning; a written entry left without its wiki proxy at transaction close → warning; log/hot lines carrying diary content → error; diary content relayed outside the instance (external systems, framework/package repositories) without explicit request → error; a proxy body copying the entry's full text → warning (registration-first); a file name not matching YYYY-MM-DD.md → info (naming drift is human freedom)"
